name: Automated Build and Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # Check if we should skip this build
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should-skip: ${{ steps.check.outputs.should-skip }}
    steps:
      - name: Check for [SKIP] in commit message
        id: check
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[SKIP]"* ]]; then
            echo "should-skip=true" >> $GITHUB_OUTPUT
            echo "🚫 Build skipped due to [SKIP] in commit message"
          else
            echo "should-skip=false" >> $GITHUB_OUTPUT
            echo "✅ Build will proceed"
          fi

  # Run tests first
  test:
    needs: check-skip
    if: needs.check-skip.outputs.should-skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Run linting
        run: npm run lint

      - name: Build Next.js app (test build)
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Build Electron main process (test build)
        run: npm run build:electron

  # Version calculation and changelog generation
  prepare-release:
    needs: [check-skip, test]
    if: needs.check-skip.outputs.should-skip != 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      new-version: ${{ steps.version.outputs.new-version }}
      new-tag: ${{ steps.version.outputs.new-tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Calculate new version
        id: version
        run: |
          # Get current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Parse version parts
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "New version: $NEW_VERSION"
          echo "New tag: $NEW_TAG"

          # Output for next steps
          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new-tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get the last release tag (if any)
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            echo "📝 First release - including all commits"
            # First release - get all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            echo "📝 Getting commits since last tag: $LAST_TAG"
            # Get commits since last tag
            CHANGELOG=$(git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi

          # Escape newlines for GitHub output
          CHANGELOG="${CHANGELOG//'%'/'%25'}"
          CHANGELOG="${CHANGELOG//$'\n'/'%0A'}"
          CHANGELOG="${CHANGELOG//$'\r'/'%0D'}"

          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

  # Build artifacts
  build:
    needs: [check-skip, test, prepare-release]
    if: needs.check-skip.outputs.should-skip != 'true' && needs.test.result == 'success'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update version in package.json
        run: |
          # Update package.json with new version for build
          npm version ${{ needs.prepare-release.outputs.new-version }} --no-git-tag-version

      - name: Build Next.js app
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: true

      - name: Build Electron main process
        run: npm run build:electron

      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/build-ci.sh --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        run: ./scripts/build-ci.bat --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-latest'
        run: ./scripts/build-ci.sh --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.msi

      - name: Upload artifacts (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            release/*.dmg
            release/*.zip

  # Create GitHub release with all artifacts
  release:
    needs: [check-skip, test, prepare-release, build]
    if: needs.check-skip.outputs.should-skip != 'true' && needs.test.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -la artifacts/

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.prepare-release.outputs.new-tag }}
          name: ThermoSense ${{ needs.prepare-release.outputs.new-tag }}
          body: |
            ## ThermoSense Desktop Application ${{ needs.prepare-release.outputs.new-tag }}

            ### 🚀 What's New:
            ${{ needs.prepare-release.outputs.changelog }}

            ### 📦 Downloads:
            - **Windows**: Download the `.exe` installer for easy installation
            - **macOS**: Download the `.dmg` file and drag to Applications
            - **Linux**: Download the `.AppImage` for universal compatibility, or `.deb`/`.rpm` for your distribution

            ### 🛠️ Installation:
            - **Windows**: Run the installer and follow the setup wizard
            - **macOS**: Open the DMG and drag ThermoSense to Applications folder
            - **Linux**: Make the AppImage executable (`chmod +x`) and run, or install the package file

            ### 🔧 System Requirements:
            - **Windows**: Windows 10 or later
            - **macOS**: macOS 10.15 (Catalina) or later
            - **Linux**: Most modern distributions with glibc 2.17+

            ---
            **Built from commit:** ${{ github.sha }}
            **Build date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          draft: false
          prerelease: false
          generate_release_notes: false
          make_latest: true
          files: |
            artifacts/linux-build/*
            artifacts/windows-build/*
            artifacts/macos-build/*

  # Update package.json version in repository
  update-version:
    needs: [check-skip, test, prepare-release, build, release]
    if: needs.check-skip.outputs.should-skip != 'true' && needs.release.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Update package.json version
        run: |
          # Update package.json with new version
          npm version ${{ needs.prepare-release.outputs.new-version }} --no-git-tag-version

          # Commit the version update
          git add package.json
          git commit -m "🔖 Bump version to ${{ needs.prepare-release.outputs.new-version }} [SKIP]"

          # Push the commit
          git push origin HEAD:${{ github.ref_name }}

  # Notification
  notify:
    needs: [check-skip, test, prepare-release, build, release, update-version]
    runs-on: ubuntu-latest
    if: always() && needs.check-skip.outputs.should-skip != 'true'

    steps:
      - name: Notify success
        if: needs.test.result == 'success' && needs.build.result == 'success' && needs.release.result == 'success'
        run: |
          echo "🎉 Automated release completed successfully!"
          echo "✅ Tests passed"
          echo "✅ Version bumped to ${{ needs.prepare-release.outputs.new-version }}"
          echo "✅ Tag ${{ needs.prepare-release.outputs.new-tag }} created"
          echo "✅ All platform builds completed"
          echo "✅ Release created with artifacts"
          echo "✅ Repository version updated"

      - name: Notify failure
        if: needs.test.result == 'failure' || needs.build.result == 'failure' || needs.release.result == 'failure'
        run: |
          echo "❌ Automated release failed!"
          echo "Test result: ${{ needs.test.result }}"
          echo "Build result: ${{ needs.build.result }}"
          echo "Release result: ${{ needs.release.result }}"
          echo "Check the logs for details."
          exit 1
